name: VDR Creation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 2'  # Every Tuesday at 12:00 UTC
  push:
    branches: [ main ]
  pull_request: # prs don't get secrets, but the API works (albeit 10x slower) without the api key
    branches: [ main ]

# Safe default: read-only for all jobs. The publish job overrides to contents: write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.13
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Download ojvg
      env:
        NIST_NVD_TOKEN: ${{ secrets.NIST_NVD_TOKEN }}
      run: |
        mkdir -p data
        python3 ojvg_download.py
        python3 ojvg_convert.py

    - name: Upload data directory (for debugging/introspection)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: data directory
        path: data

    - name: Upload final vdr
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: final vdr
        path: data/vdr.json

  publish:
    needs: build
    # Only publish releases for trusted, successful builds - not pull requests
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases and upload release assets
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.13
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Generate VDR
      env:
        NIST_NVD_TOKEN: ${{ secrets.NIST_NVD_TOKEN }}
      run: |
        mkdir -p data
        python3 ojvg_download.py
        python3 ojvg_convert.py

    - name: Prepare release assets
      run: |
        DATE=$(date -u +%d-%m-%Y)
        TAG="temurin-vdr-${DATE}-${{ github.run_id }}"
        ASSET_JSON="${TAG}.json"
        ASSET_SHA256="${TAG}.sha256"

        cp data/vdr.json "${ASSET_JSON}"
        sha256sum "${ASSET_JSON}" > "${ASSET_SHA256}"

        echo "TAG=${TAG}"           >> "$GITHUB_ENV"
        echo "ASSET_JSON=${ASSET_JSON}"     >> "$GITHUB_ENV"
        echo "ASSET_SHA256=${ASSET_SHA256}" >> "$GITHUB_ENV"

    - name: Create draft release, attach assets, and publish
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES="Source commit: ${{ github.sha }}
        Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        gh release create "${TAG}" \
          --title "${TAG}" \
          --notes "${NOTES}" \
          --draft \
          "${ASSET_JSON}" \
          "${ASSET_SHA256}"

        gh release edit "${TAG}" --draft=false
